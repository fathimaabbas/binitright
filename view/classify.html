<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waste Classification | Bin It Right</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #e8f5e9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 20px;
            width: 360px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #2e7d32;
        }

        video, canvas {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
        }

        button {
            margin-top: 14px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #43a047;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2e7d32;
        }

        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #f1f8e9;
            display: none;
        }

        .label {
            font-size: 22px;
            font-weight: bold;
            color: #1b5e20;
        }

        .confidence {
            margin-top: 5px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>♻️ Waste Classifier</h2>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button onclick="captureAndPredict()">📸 Capture & Predict</button>

    <div class="result" id="resultBox">
        <div class="label" id="label"></div>
        <div class="confidence" id="confidence"></div>
    </div>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultBox = document.getElementById("resultBox");
    const labelEl = document.getElementById("label");
    const confidenceEl = document.getElementById("confidence");

    // 🎥 Start Camera
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream)
        .catch(() => alert("❌ Camera access denied"));

    function captureAndPredict() {
        const ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);

        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append("image", blob, "capture.jpg");

            fetch("/api/classify-waste", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    resultBox.style.display = "block";
                    labelEl.innerText = data.prediction;
                    confidenceEl.innerText =
                        "Confidence: " + (data.confidence * 100).toFixed(2) + "%";
                } else {
                    alert("❌ Prediction failed");
                }
            })
            .catch(err => {
                console.error(err);
                alert("❌ Server error");
            });

        }, "image/jpeg");
    }
</script>

</body>
</html>
