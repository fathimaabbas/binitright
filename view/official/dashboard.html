<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Official Dashboard – Recycling</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
  padding: 20px;
}

h2 {
  color: #2e7d32;
  margin-bottom: 20px;
}

table {
  width: 100%;
  background: white;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

th {
  background: #e8f5e9;
  padding: 12px;
  text-align: left;
}

td {
  padding: 12px;
  border-bottom: 1px solid #eee;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.pending { background: #fff3cd; color: #856404; }
.accepted { background: #cce5ff; color: #004085; }
.collected { background: #d4edda; color: #155724; }

button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}
.delete {
  background: #e53935;
  color: white;
}

.view { background: #607d8b; color: white; }
.accept { background: #2196f3; color: white; }
.collect { background: #4caf50; color: white; }

button:hover { opacity: 0.9; }

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 90%;
  max-height: 90%;
}

.modal-content img {
  max-width: 100%;
  max-height: 80vh;
  border-radius: 8px;
}

.close {
  float: right;
  font-size: 20px;
  cursor: pointer;
}
</style>
</head>

<body>
<button onclick="logout()" style="float:right;background:#d32f2f;color:white;">
  Logout
</button>

<h2>♻️ Recycling Requests Dashboard</h2>

<table>
<thead>
<tr>
  <th>Customer</th>
  <th>Contact</th>
  <th>Location</th>
  <th>Waste</th>
  <th>Price</th>
  <th>Image</th>
  <th>Status</th>
  <th>Action</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<!-- IMAGE MODAL -->
<div class="modal" id="imageModal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <img id="modalImage" src="">
  </div>
</div>

<script>
async function loadData() {
  const res = await fetch('/api/recycling');
  const data = await res.json();

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  data.forEach(r => {
   let actionBtn = '-';

if (r.status === 'Pending') {
  actionBtn = `<button class="accept" onclick="acceptReq(${r.id})">Accept</button>`;
} 
else if (r.status === 'Accepted') {
  actionBtn = `<button class="collect" onclick="collectReq(${r.id})">Collected</button>`;
} 
else if (r.status === 'Collected') {
  actionBtn = `
    <button class="delete" onclick="deleteReq(${r.id})">
      Delete
    </button>
  `;
}


    tbody.innerHTML += `
      <tr>
        <td>${r.customer_name}</td>
        <td>${r.contact_number}</td>
        <td>${r.location}</td>
        <td>${r.waste_type}</td>
        <td>₹${r.expected_price}</td>
        <td>
          <button class="view" onclick="viewImage('${r.image_url}')">View Image</button>
        </td>
        <td>
          <span class="status ${r.status.toLowerCase()}">${r.status}</span>
        </td>
        <td>${actionBtn}</td>
      </tr>
    `;
  });
}
async function deleteReq(id) {
  if (!confirm("Are you sure you want to delete this collected request?")) return;

  const res = await fetch(`/api/recycling/${id}`, {
    method: 'DELETE'
  });

  const data = await res.json();
  alert(data.message);
  loadData();
}

function viewImage(url) {
  const modal = document.getElementById("imageModal");
  const img = document.getElementById("modalImage");
  img.src = url;
  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}

async function acceptReq(id) {
  await fetch('/api/recycling', { credentials: 'include' });

  loadData();
}

async function collectReq(id) {
  await fetch('/api/recycling', { credentials: 'include' });

  loadData();
}

loadData();

async function logout() {
  await fetch('/logout', {
    method: 'POST',
    credentials: 'include'
  });
  window.location.href = '/login.html';
}

</script>

</body>
</html>
